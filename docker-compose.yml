services:
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kb_estate}
      POSTGRES_USER: ${POSTGRES_USER:-kb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kb_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kb_user} -d ${POSTGRES_DB:-kb_estate}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 정보계 Oracle 시뮬레이터 — #1 운영 ETL(Oracle→PG) 개발/검증용. 기본 stack 비포함(profile).
  # 실행: docker compose --profile oracle up -d oracle  /  운영선 이 서비스 대신 사내 Oracle DSN 사용.
  oracle:
    image: gvenzl/oracle-free:slim
    profiles: ["oracle"]
    restart: unless-stopped
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-oracle}
      APP_USER: ${ORACLE_APP_USER:-kbsrc}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:-kbsrc}
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 180s

  mineru-api:
    build:
      context: ./mineru-api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${MINERU_PORT:-8200}:8000"
    volumes:
      - mineru_models:/models

  registry-api:
    build:
      context: ./etc/등기부등본api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./etc/등기부등본api/.env
        required: true
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-kb_user}:${POSTGRES_PASSWORD:-kb_password}@postgres:5432/${POSTGRES_DB:-kb_estate}
      STORAGE_DIR: /app/storage/pdf
      # 컨테이너 dns — 호스트 매핑 8200 이 아니라 mineru 컨테이너 내부 포트 8000 사용
      MINERU_API_URL: http://mineru-api:8000
    volumes:
      - ./etc/등기부등본api/storage/pdf:/app/storage/pdf
    ports:
      - "${REGISTRY_PORT:-8100}:8100"
    depends_on:
      postgres:
        condition: service_healthy
      mineru-api:
        condition: service_started

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kb_user}:${POSTGRES_PASSWORD:-kb_password}@postgres:5432/${POSTGRES_DB:-kb_estate}
      REDIS_URL: redis://redis:6379/0
      MINERU_API_URL: http://mineru-api:8000
      REGISTRY_API_URL: http://registry-api:8100
    ports:
      - "${BACKEND_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mineru-api:
        condition: service_started
      registry-api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 빈 값 → 빌드 산출물에 상대 URL 사용 → nginx가 /api를 backend로 프록시
        VITE_API_BASE_URL: ""
        # 지도 타일. 운영망: OSM. 폐쇄망 이관 시 빈 값으로 두면 점만 표시.
        VITE_MAP_TILE_URL: "${VITE_MAP_TILE_URL:-https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png}"
        VITE_MAP_TILE_ATTRIBUTION: "${VITE_MAP_TILE_ATTRIBUTION:-&copy; OpenStreetMap}"
    restart: unless-stopped
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8002"
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  mineru_models:
  oracle_data:
